# Render Blueprint — ReerHub backend (staging)
# Deploy: Dashboard "New -> Blueprint" -> pick github.com/ReerHub/reerhub-backend.
# Secrets (sync: false) are set in the Render dashboard after first deploy.
services:
  - type: web
    name: reerhub-backend-staging
    runtime: node
    repo: https://github.com/ReerHub/reerhub-backend
    branch: main
    plan: starter # always-on (free tier sleeps and would stall the daily sync cron)
    healthCheckPath: /api/v1/health
    buildCommand: npm ci && npm run lint && npm test
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8000
      - key: MONGO_DB_NAME
        value: reerhub-staging
      - key: CORS_FRONTEND_URL
        value: https://staging.reerhub.com
      - key: WORKER_ENABLED
        value: "true"
      - key: SYNC_CONCURRENCY
        value: "5"
      - key: ADAPTER_FETCH_TIMEOUT_MS
        value: "30000"
      # Secrets — fill in the Render dashboard (Service -> Environment):
      - key: MONGO_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: API_KEY
        sync: false