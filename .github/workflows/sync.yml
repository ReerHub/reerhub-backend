name: Scheduled sync

# Render's free tier sleeps, so the in-app BullMQ daily scheduler cannot be
# trusted. This workflow is the reliable external trigger: it wakes the API,
# waits for health, then enqueues a sync per source. Syncs are idempotent, so
# an occasional overlap with the in-app scheduler is harmless.
#
# Requires repository secret: API_KEY (the production write key).
# Note: GitHub disables scheduled workflows after 60 days of repo inactivity.

on:
  schedule:
    - cron: "0 2 * * *" # daily, 02:00 UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Wake API and wait for health
        run: |
          url="https://api.reerhub.com/api/v1/health"
          for i in $(seq 1 30); do
            if curl -fsS "$url" >/dev/null 2>&1; then
              echo "API healthy after $((i * 10))s"
              exit 0
            fi
            echo "waiting for API to wake ($i/30)…"
            sleep 10
          done
          echo "API did not become healthy after 5 minutes" >&2
          exit 1

      - name: Trigger a sync per source
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          base="https://api.reerhub.com/api/v1"
          ids=$(curl -fsS "$base/job-sources" | jq -r '.data[]._id')
          if [ -z "$ids" ]; then
            echo "No job sources returned" >&2
            exit 1
          fi
          for id in $ids; do
            echo "triggering sync for $id"
            curl -fsS -X POST -H "x-api-key: $API_KEY" \
              "$base/job-sources/$id/sync" || echo "trigger failed for $id"
          done

      - name: Smoke check
        run: |
          curl -fsS "https://api.reerhub.com/api/v1/health"
          curl -fsS "https://api.reerhub.com/api/v1/sync-logs?limit=1" >/dev/null
          echo "smoke ok"
