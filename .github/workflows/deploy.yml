name: Backend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:6
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
        env:
          MONGO_URI: mongodb://127.0.0.1:27017
          MONGO_DB_NAME: reerhub-test

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Trigger Render deploy hook
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

  smoke:
    if: github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Wait for staging API
        run: |
          url="https://api.staging.reerhub.com/api/v1/health"
          for i in $(seq 1 60); do
            if curl -fsS "$url" >/dev/null 2>&1; then
              echo "Healthy after $((i * 10))s"; exit 0
            fi
            sleep 10
          done
          echo "API not healthy after 10 minutes" >&2
          exit 1
      - name: Run smoke checks
        run: SMOKE_API_BASE=https://api.staging.reerhub.com/api/v1 node src/scripts/smoke.js